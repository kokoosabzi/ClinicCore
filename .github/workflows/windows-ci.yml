name: ClinicCore Windows CI

on:
  push:
    branches:
      - main
      - stabilization/windows-sqlite-runtime
      - feature/user-management-rbac
      - feature/dynamic-ui-themes
      - ui/**
  pull_request:
    branches:
      - main
      - stabilization/windows-sqlite-runtime
      - feature/user-management-rbac
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: sqlite:///./data/cliniccore-ci.db
      SECRET_KEY: cliniccore-ci-only-secret-key-not-for-production
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ci-only-not-for-production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js for UI script validation
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile application and tests
        run: python -m compileall app tests main.py alembic scripts

      - name: Validate JavaScript syntax
        shell: pwsh
        run: |
          node --check app/static/js/appearance.js
          node --check app/static/js/appointment-booking.js
          node --check app/static/js/jalali-date-picker.js
          node --check app/static/js/koko-theme-engine.js
          node --check app/static/js/koko-workspace-tabs.js

      - name: Run test suite
        run: python -m pytest -q

      - name: Verify clean SQLite migration
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path data | Out-Null
          if (Test-Path data/cliniccore-ci.db) {
            Remove-Item data/cliniccore-ci.db -Force
          }
          python -m alembic upgrade head
          if (-not (Test-Path data/cliniccore-ci.db)) {
            throw "Alembic did not create the expected SQLite database."
          }
