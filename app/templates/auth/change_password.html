{% extends "base.html" %}
{% block content %}
<h1>تغییر رمز عبور</h1>
{% if error %}<p class="alert">{{ error }}</p>{% endif %}
<form method="post" action="/change-password" class="form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>رمز جدید<input name="password" type="password" autocomplete="new-password" required minlength="8"></label>
  <label>تکرار رمز جدید<input name="confirm" type="password" autocomplete="new-password" required minlength="8"></label>
  <button type="submit">ثبت رمز جدید</button>
</form>
{% endblock %}
