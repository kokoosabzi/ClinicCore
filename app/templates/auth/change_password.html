{% extends "base.html" %}
{% block content %}
<section class="card koko-form-section koko-auth-form" aria-labelledby="change-password-heading">
  <header><h1 id="change-password-heading">تغییر رمز عبور</h1></header>
  {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/change-password" class="form koko-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label class="koko-field">رمز جدید<input name="password" type="password" autocomplete="new-password" required minlength="8"></label>
    <label class="koko-field">تکرار رمز جدید<input name="confirm" type="password" autocomplete="new-password" required minlength="8"></label>
    <div class="koko-form-actions"><button class="koko-button" type="submit">ثبت رمز جدید</button></div>
  </form>
</section>
{% endblock %}
