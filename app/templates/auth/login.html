{% extends "base.html" %}
{% block content %}
<section class="card koko-form-section koko-auth-form" aria-labelledby="login-heading">
  <header><h1 id="login-heading">ورود مدیر</h1></header>
  {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="form koko-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label class="koko-field">نام کاربری<input name="username" autocomplete="username" required></label>
    <label class="koko-field">رمز عبور<input name="password" type="password" autocomplete="current-password" required></label>
    <div class="koko-form-actions"><button class="koko-button" type="submit">ورود</button></div>
  </form>
</section>
<p class="hint">در نصب تازه، حساب مدیر به‌صورت خودکار و با رمز تصادفی ساخته می‌شود. در صورت نیاز به ایجاد دستی مدیر، ابتدا یک رمز قوی در تنظیمات محیطی تعیین کنید.</p>
{% endblock %}
