{% extends "base.html" %}
{% block content %}
<h1>ورود مدیر</h1>
{% if error %}<p class="alert">{{ error }}</p>{% endif %}
<form method="post" action="/login" class="form">
  <label>نام کاربری<input name="username" autocomplete="username" required></label>
  <label>رمز عبور<input name="password" type="password" autocomplete="current-password" required></label>
  <button type="submit">ورود</button>
</form>
<p class="hint">برای ایجاد کاربر اولیه، <code>python scripts/seed_admin.py</code> را اجرا کنید. در محیط واقعی قبل از seed، مقدار <code>ADMIN_PASSWORD</code> را تنظیم کنید.</p>
{% endblock %}
