<!doctype html>
<html lang="fa" dir="rtl" data-theme="{{ app_theme or 'system' }}" data-density="{{ app_density or 'comfortable' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or app_title or app_name or "ClinicCore" }}</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
  <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script>
    document.documentElement.dataset.theme = "{{ app_theme or 'system' }}";
    document.documentElement.dataset.density = "{{ app_density or 'comfortable' }}";
  </script>
</head>
<body>
  <header class="topbar">
    <strong>{{ app_title or "کلینیک‌کور" }}</strong>
    <nav>
      <a href="/dashboard">داشبورد</a>
      <a href="/patients">بیماران</a>
      <a href="/appointments">نوبت‌ها</a>
      <a href="/financial">مالی</a>
      <a href="/messages">پیام‌ها</a>
      {% if user and (user.role == "admin" or user["role"] == "admin") %}
      <a href="/settings">تنظیمات</a>
      {% endif %}
      <a href="/login">ورود</a>
      {% if user %}
      <form method="post" action="/logout" class="logout-form"><button type="submit">خروج {{ user.username if user.username else user["username"] }}</button></form>
      {% endif %}
    </nav>
  </header>
  <main class="container">{% block content %}{% endblock %}</main>
</body>
</html>
