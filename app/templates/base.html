<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or app_name or "ClinicCore" }}</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
  <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</head>
<body>
  <header class="topbar">
    <strong>کلینیک‌کور</strong>
    <nav>
      <a href="/dashboard">داشبورد</a>
      <a href="/patients">بیماران</a>
      <a href="/appointments">نوبت‌ها</a>
      <a href="/financial">مالی</a>
      <a href="/messages">پیام‌ها</a>
      <a href="/login">ورود</a>
      {% if user %}
      <form method="post" action="/logout" class="logout-form"><button type="submit">خروج {{ user }}</button></form>
      {% endif %}
    </nav>
  </header>
  <main class="container">{% block content %}{% endblock %}</main>
</body>
</html>
