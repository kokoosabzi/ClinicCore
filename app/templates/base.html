<!doctype html>
<html lang="fa" dir="rtl" data-theme="{{ app_theme or 'system' }}" data-density="{{ app_density or 'comfortable' }}" data-calendar="{{ datetime_calendar or 'jalali' }}" data-timezone="{{ datetime_timezone or 'Asia/Tehran' }}" data-date-format="{{ datetime_date_format or 'YYYY/MM/DD' }}" data-time-format="{{ datetime_time_format or '24' }}" data-show-seconds="{{ datetime_show_seconds or 'false' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or app_title or app_name or "ClinicCore" }}</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
  <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script>
    const root = document.documentElement;
    root.dataset.theme = "{{ app_theme or 'system' }}";
    root.dataset.density = "{{ app_density or 'comfortable' }}";
    root.dataset.calendar = "{{ datetime_calendar or 'jalali' }}";
    root.dataset.timezone = "{{ datetime_timezone or 'Asia/Tehran' }}";
    root.dataset.dateFormat = "{{ datetime_date_format or 'YYYY/MM/DD' }}";
    root.dataset.timeFormat = "{{ datetime_time_format or '24' }}";
    root.dataset.showSeconds = "{{ datetime_show_seconds or 'false' }}";
  </script>
  <script>
    document.addEventListener("submit", function (event) {
      const form = event.target;
      if (!form.classList.contains("form")) return;
      form.classList.add("is-submitting");
      form.setAttribute("aria-busy", "true");
      const button = form.querySelector("button[type=\"submit\"]");
      if (button) { button.disabled = true; button.dataset.originalText = button.textContent; button.textContent = "در حال ثبت..."; }
    });
  </script>
</head>
<body>
  <header class="topbar">
    <strong>{{ app_title or "کلینیک‌کور" }}</strong>
    <button class="nav-toggle no-print" type="button" aria-controls="main-nav" aria-expanded="false" onclick="document.getElementById('main-nav').classList.toggle('is-open'); this.setAttribute('aria-expanded', document.getElementById('main-nav').classList.contains('is-open'));">منو</button>
    <nav id="main-nav">
      <a class="{% if request.url.path == '/dashboard' %}active{% endif %}" href="/dashboard">داشبورد</a>
      <a class="{% if request.url.path.startswith('/patients') %}active{% endif %}" href="/patients">بیماران</a>
      <a class="{% if request.url.path.startswith('/appointments') %}active{% endif %}" href="/appointments">نوبت‌ها</a>
      <a class="{% if request.url.path.startswith('/financial') %}active{% endif %}" href="/financial">مالی</a>
      <a class="{% if request.url.path.startswith('/messages') %}active{% endif %}" href="/messages">پیام‌ها</a>
      {% if user and (user.role == "admin" or user["role"] == "admin") %}
      <a class="{% if request.url.path.startswith('/settings') %}active{% endif %}" href="/settings">تنظیمات</a>
      {% endif %}
      <a href="/login">ورود</a>
      {% if user %}
      <form method="post" action="/logout" class="logout-form"><button type="submit">خروج {{ user.username if user.username else user["username"] }}</button></form>
      {% endif %}
    </nav>
  </header>
  <main class="container">
    {% if request.url.path != "/dashboard" %}
    <div class="page-actions no-print"><a class="back-link" href="javascript:history.back()">بازگشت</a></div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
