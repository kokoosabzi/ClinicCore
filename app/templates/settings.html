{% extends "base.html" %}
{% block content %}
<h1>تنظیمات سامانه</h1>
{% if saved %}<p class="alert">تنظیمات با موفقیت ذخیره شد.</p>{% endif %}
{% if error %}<p class="alert">{{ error }}</p>{% endif %}
<form method="post" action="/settings" class="form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <h2>عمومی</h2>
  <label>نام سامانه<input name="app_name" value="{{ settings['app.name'] or '' }}" maxlength="4000" required></label>
  <label>عنوان نمایشی سامانه<input name="app_title" value="{{ settings['app.title'] or '' }}" maxlength="4000" required></label>

  <h2>ظاهر</h2>
  <label>حالت نمایش
    <select name="app_theme">
      <option value="system" {% if settings['app.theme'] == 'system' %}selected{% endif %}>همگام با سیستم</option>
      <option value="light" {% if settings['app.theme'] == 'light' %}selected{% endif %}>روشن</option>
      <option value="dark" {% if settings['app.theme'] == 'dark' %}selected{% endif %}>تاریک</option>
    </select>
  </label>
  <label>تراکم نمایش
    <select name="app_density">
      <option value="comfortable" {% if settings['app.density'] == 'comfortable' %}selected{% endif %}>راحت</option>
      <option value="compact" {% if settings['app.density'] == 'compact' %}selected{% endif %}>فشرده</option>
    </select>
  </label>

  <h2>تاریخ و زمان</h2>
  <label>تقویم نمایش
    <select name="datetime_calendar">
      <option value="jalali" {% if settings['datetime.calendar'] == 'jalali' %}selected{% endif %}>جلالی</option>
      <option value="gregorian" {% if settings['datetime.calendar'] == 'gregorian' %}selected{% endif %}>میلادی</option>
    </select>
  </label>
  <label>منطقه زمانی
    <input name="datetime_timezone" value="{{ settings['datetime.timezone'] or 'Asia/Tehran' }}" maxlength="100" required>
  </label>
  <label>قالب تاریخ
    <select name="datetime_date_format">
      <option value="YYYY/MM/DD" {% if settings['datetime.date_format'] == 'YYYY/MM/DD' %}selected{% endif %}>۱۴۰۵/۰۷/۱۳</option>
      <option value="YYYY-MM-DD" {% if settings['datetime.date_format'] == 'YYYY-MM-DD' %}selected{% endif %}>۱۴۰۵-۰۷-۱۳</option>
      <option value="DD/MM/YYYY" {% if settings['datetime.date_format'] == 'DD/MM/YYYY' %}selected{% endif %}>۱۳/۰۷/۱۴۰۵</option>
      <option value="DD-MM-YYYY" {% if settings['datetime.date_format'] == 'DD-MM-YYYY' %}selected{% endif %}>۱۳-۰۷-۱۴۰۵</option>
    </select>
  </label>
  <label>قالب ساعت
    <select name="datetime_time_format">
      <option value="24" {% if settings['datetime.time_format'] == '24' %}selected{% endif %}>۲۴ ساعته</option>
      <option value="12" {% if settings['datetime.time_format'] == '12' %}selected{% endif %}>۱۲ ساعته</option>
    </select>
  </label>
  <label>نمایش ثانیه
    <select name="datetime_show_seconds">
      <option value="false" {% if settings['datetime.show_seconds'] == 'false' %}selected{% endif %}>خیر</option>
      <option value="true" {% if settings['datetime.show_seconds'] == 'true' %}selected{% endif %}>بله</option>
    </select>
  </label>

  <h2>گزارش‌ها</h2>
  <label>لوگوی گزارش<input name="reports_logo" value="{{ settings['reports.logo'] or '' }}" maxlength="4000"></label>
  <label>سربرگ گزارش<textarea name="reports_header" maxlength="4000">{{ settings['reports.header'] or '' }}</textarea></label>
  <label>پاورقی گزارش<textarea name="reports_footer" maxlength="4000">{{ settings['reports.footer'] or '' }}</textarea></label>
  <label>قالب پیش‌فرض گزارش
    <select name="reports_default_format">
      <option value="html" {% if settings['reports.default_format'] == 'html' %}selected{% endif %}>HTML</option>
      <option value="csv" {% if settings['reports.default_format'] == 'csv' %}selected{% endif %}>CSV</option>
      <option value="pdf" {% if settings['reports.default_format'] == 'pdf' %}selected{% endif %}>PDF</option>
    </select>
  </label>
  <label>نمایش زمان تولید گزارش
    <select name="reports_include_timestamp">
      <option value="true" {% if settings['reports.include_timestamp'] == 'true' %}selected{% endif %}>بله</option>
      <option value="false" {% if settings['reports.include_timestamp'] == 'false' %}selected{% endif %}>خیر</option>
    </select>
  </label>

  <h2>هویت کلینیک</h2>
  <label>نام کلینیک<input name="clinic_name" value="{{ settings['clinic.name'] or '' }}" maxlength="4000"></label>
  <label>آدرس<textarea name="clinic_address" maxlength="4000">{{ settings['clinic.address'] or '' }}</textarea></label>
  <label>تلفن<input name="clinic_phone" value="{{ settings['clinic.phone'] or '' }}" maxlength="4000"></label>
  <label>ایمیل<input name="clinic_email" type="email" value="{{ settings['clinic.email'] or '' }}" maxlength="4000"></label>
  <label>لوگو<input name="clinic_logo" value="{{ settings['clinic.logo'] or '' }}" maxlength="4000"></label>
  <label>متن سربرگ<textarea name="clinic_header_text" maxlength="4000">{{ settings['clinic.header_text'] or '' }}</textarea></label>
  <label>متن پاورقی<textarea name="clinic_footer_text" maxlength="4000">{{ settings['clinic.footer_text'] or '' }}</textarea></label>

  <button type="submit">ذخیره تنظیمات</button>
</form>
{% endblock %}
